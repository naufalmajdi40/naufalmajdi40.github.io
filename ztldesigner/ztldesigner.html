<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asyik ZPL Studio Pro - Visual Label Editor</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Courier+Prime&family=Montserrat:wght@400;600;700&family=Oswald:wght@400;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Fabric.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- JsBarcode CDN -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <!-- QRCode.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QZ Tray CDN -->
    <script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.min.js"></script>
    <!-- Custom JS -->
     <script src="script.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Studio Canvas Background Pattern */
        .bg-grid-pattern {
            background-image: radial-gradient(circle, rgba(148, 163, 184, 0.3) 1px, transparent 1px);
            background-size: 16px 16px;
        }
        
        .dark .bg-grid-pattern {
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 16px 16px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-screen flex flex-col overflow-hidden select-none transition-colors duration-200">

    <!-- Hidden Input File Open -->
    <input type="file" id="zplFileInput" accept=".zpl,.txt" onchange="handleFileOpen(event)" class="hidden">

    <!-- TOP HEADER NAVBAR -->
    <header class="h-14 bg-white dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 px-4 flex items-center justify-between shrink-0 z-20 transition-colors">
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-indigo-500/30">
                    <i data-lucide="printer" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-base tracking-wide text-slate-900 dark:text-white">Asyik ZPL Studio <span class="text-xs bg-indigo-500/10 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 border border-indigo-500/30 px-1.5 py-0.5 rounded ml-1">PRO</span></span>
            </div>
            
            <div class="h-4 w-[1px] bg-slate-300 dark:bg-slate-800 mx-2"></div>

            <!-- File Operations -->
            <div class="flex items-center gap-1.5">
                <button onclick="triggerOpenFile()" class="px-2.5 py-1.5 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white text-xs font-medium transition flex items-center gap-1.5">
                    <i data-lucide="folder-open" class="w-4 h-4 text-slate-400"></i> Buka ZPL
                </button>
                <button onclick="downloadZPLFile()" class="px-2.5 py-1.5 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white text-xs font-medium transition flex items-center gap-1.5">
                    <i data-lucide="download" class="w-4 h-4 text-slate-400"></i> Simpan ZPL
                </button>
            </div>
        </div>

        <!-- Middle Tools (History) -->
        <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-1 rounded-lg">
            <button id="btnUndo" onclick="undo()" disabled class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-800 disabled:opacity-30 text-slate-700 dark:text-slate-300 transition">
                <i data-lucide="undo-2" class="w-4 h-4"></i>
            </button>
            <button id="btnRedo" onclick="redo()" disabled class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-800 disabled:opacity-30 text-slate-700 dark:text-slate-300 transition">
                <i data-lucide="redo-2" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Right Quick Actions -->
        <div class="flex items-center gap-2">
            <button onclick="toggleDarkMode()" id="themeBtn" title="Ganti Mode Terang/Gelap" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition">
                <i data-lucide="sun" class="w-4 h-4"></i>
            </button>
            <button onclick="clearCanvas()" class="px-3 py-1.5 rounded-lg border border-red-200 dark:border-red-900/40 bg-red-50 dark:bg-red-950/20 hover:bg-red-100 dark:hover:bg-red-900/40 text-red-600 dark:text-red-400 text-xs font-medium transition flex items-center gap-1.5">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Reset
            </button>
            <button onclick="generateZPL()" class="px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold shadow-lg shadow-indigo-600/30 transition flex items-center gap-1.5">
                <i data-lucide="code" class="w-4 h-4"></i> Export ZPL
            </button>
        </div>
    </header>

    <!-- CONTEXTUAL TOP TOOLBAR -->
    <div class="h-11 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-6 flex items-center justify-between text-xs text-slate-600 dark:text-slate-400 shrink-0 z-10 transition-colors">
        <div class="flex items-center gap-4">
            <!-- Align Quick Bar -->
            <div class="flex items-center gap-1 border-r border-slate-200 dark:border-slate-800 pr-4">
                <span class="text-[11px] font-medium text-slate-400 dark:text-slate-500 mr-1">Ratakan:</span>
                <button onclick="alignObject('left')" title="Kiri" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-200 rounded transition"><i data-lucide="align-start-vertical" class="w-4 h-4"></i></button>
                <button onclick="alignObject('center-h')" title="Tengah Horisontal" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-200 rounded transition"><i data-lucide="align-center-vertical" class="w-4 h-4"></i></button>
                <button onclick="alignObject('right')" title="Kanan" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-200 rounded transition"><i data-lucide="align-end-vertical" class="w-4 h-4"></i></button>
                <button onclick="alignObject('top')" title="Atas" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-200 rounded transition"><i data-lucide="align-start-horizontal" class="w-4 h-4"></i></button>
                <button onclick="alignObject('center-v')" title="Tengah Vertikal" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-200 rounded transition"><i data-lucide="align-center-horizontal" class="w-4 h-4"></i></button>
                <button onclick="alignObject('bottom')" title="Bawah" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-200 rounded transition"><i data-lucide="align-end-horizontal" class="w-4 h-4"></i></button>
            </div>

            <!-- Rotate Quick Bar -->
            <div class="flex items-center gap-1 border-r border-slate-200 dark:border-slate-800 pr-4">
                <span class="text-[11px] font-medium text-slate-400 dark:text-slate-500 mr-1">Rotasi:</span>
                <button onclick="rotateSelected(-90)" title="-90°" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-200 rounded transition"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
                <button onclick="rotateSelected(90)" title="+90°" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-200 rounded transition"><i data-lucide="rotate-cw" class="w-4 h-4"></i></button>
                <button onclick="rotateSelected(180)" title="180°" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-200 rounded text-[11px] font-mono transition">180°</button>
                <button onclick="setExactRotation(0)" title="Reset 0°" class="px-1.5 py-1 hover:bg-red-50 dark:hover:bg-red-950/40 text-red-500 dark:text-red-400 rounded text-[10px] font-medium transition">Reset</button>
                <span id="rotateDegreeVal" class="ml-2 font-mono text-indigo-600 dark:text-indigo-400 font-medium">0°</span>
            </div>

            <!-- Layer Quick Bar -->
            <div class="flex items-center gap-1">
                <span class="text-[11px] font-medium text-slate-400 dark:text-slate-500 mr-1">Layer:</span>
                <button onclick="changeLayer('front')" title="Paling Depan" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-200 rounded transition"><i data-lucide="chevrons-up" class="w-4 h-4"></i></button>
                <button onclick="changeLayer('forward')" title="Maju" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-200 rounded transition"><i data-lucide="chevron-up" class="w-4 h-4"></i></button>
                <button onclick="changeLayer('backward')" title="Mundur" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-200 rounded transition"><i data-lucide="chevron-down" class="w-4 h-4"></i></button>
                <button onclick="changeLayer('back')" title="Paling Belakang" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-200 rounded transition"><i data-lucide="chevrons-down" class="w-4 h-4"></i></button>
            </div>
        </div>

        <div>
            <button onclick="deleteSelected()" class="px-2.5 py-1 bg-red-50 dark:bg-red-500/10 hover:bg-red-100 dark:hover:bg-red-500/20 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-500/20 rounded transition flex items-center gap-1 font-medium text-[11px]">
                <i data-lucide="trash" class="w-3.5 h-3.5"></i> Hapus Elemen
            </button>
        </div>
    </div>

    <!-- MAIN STUDIO BODY -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- SIDEBAR PANEL -->
        <aside class="w-80 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col z-10 shrink-0 transition-colors">
            
            <!-- Tab Headers -->
            <div class="flex border-b border-slate-200 dark:border-slate-800 text-xs font-medium text-slate-500 dark:text-slate-400 bg-slate-50/50 dark:bg-slate-950/50">
                <button id="tabBtnElements" onclick="switchSidebarTab('elements')" class="flex-1 py-3 border-b-2 border-indigo-600 dark:border-indigo-500 text-indigo-600 dark:text-indigo-400 font-semibold flex justify-center items-center gap-1.5 transition">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Tambah
                </button>
                <button id="tabBtnProps" onclick="switchSidebarTab('props')" class="flex-1 py-3 border-b-2 border-transparent hover:text-slate-800 dark:hover:text-slate-200 flex justify-center items-center gap-1.5 transition">
                    <i data-lucide="sliders" class="w-4 h-4"></i> Properti
                </button>
                <button id="tabBtnLayers" onclick="switchSidebarTab('layers')" class="flex-1 py-3 border-b-2 border-transparent hover:text-slate-800 dark:hover:text-slate-200 flex justify-center items-center gap-1.5 transition">
                    <i data-lucide="layers" class="w-4 h-4"></i> Layer
                </button>
            </div>

            <!-- TAB CONTENT AREA -->
            <div class="flex-1 overflow-y-auto p-4 space-y-5">
                
                <!-- TAB 1: ADD ELEMENTS -->
              <div id="tabElements" class="space-y-5">
                    
                    <!-- Text Block -->
                    <div class="space-y-2.5">
                        <label class="text-[11px] font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase flex items-center gap-1.5">
                            <i data-lucide="type" class="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400"></i> Tambah Teks
                        </label>
                        <input type="text" id="textInput" value="PRODUK ABC" placeholder="Input teks label..." class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2.5 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                        
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] text-slate-400 dark:text-slate-500 mb-1 block">Font:</label>
                                <select id="fontFamilySelect" onchange="changeFontFamily(this.value)" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                                    <option value="Arial">Arial</option>
                                    <option value="Courier Prime">Courier Prime</option>
                                    <option value="Times New Roman">Times New Roman</option>
                                    <option value="Impact">Impact</option>
                                    <option value="Roboto">Roboto</option>
                                    <option value="Montserrat">Montserrat</option>
                                    <option value="Oswald">Oswald</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 dark:text-slate-500 mb-1 block">Ukuran (pt):</label>
                                <input type="number" id="fontSizeInput" value="24" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>

                        <button onclick="addText()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-xs font-semibold shadow-md shadow-indigo-600/20 transition flex justify-center items-center gap-1.5">
                            <i data-lucide="plus" class="w-4 h-4"></i> Sisipkan Teks
                        </button>
                    </div>

                    <div class="h-[1px] bg-slate-200 dark:bg-slate-800/80"></div>

                    <!-- Serial / Counter Block -->
                    <div class="space-y-2.5">
                        <label class="text-[11px] font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase flex items-center gap-1.5">
                            <i data-lucide="hash" class="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400"></i> Serial / Counter (^SN)
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] text-slate-400 dark:text-slate-500 mb-1 block">Nilai Awal:</label>
                                <input type="text" id="counterStartInput" value="00001" placeholder="00001" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 dark:text-slate-500 mb-1 block">Increment/Step:</label>
                                <input type="number" id="counterStepInput" value="1" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] text-slate-400 dark:text-slate-500 mb-1 block">Pad Zeros:</label>
                                <select id="counterPadInput" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                                    <option value="Y">Ya (00001)</option>
                                    <option value="N">Tidak (1)</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 dark:text-slate-500 mb-1 block">Ukuran (pt):</label>
                                <input type="number" id="counterSizeInput" value="24" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>
                        <button onclick="addCounter()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-xs font-semibold shadow-md shadow-indigo-600/20 transition flex justify-center items-center gap-1.5">
                            <i data-lucide="hash" class="w-4 h-4"></i> Sisipkan Counter
                        </button>
                    </div>

                    <div class="h-[1px] bg-slate-200 dark:bg-slate-800/80"></div>

                    <!-- Date/Time Block -->
                    <div class="space-y-2.5">
                        <label class="text-[11px] font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase flex items-center gap-1.5">
                            <i data-lucide="calendar" class="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400"></i> Date / Time (^FC)
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] text-slate-400 dark:text-slate-500 mb-1 block">Format Tanggal/Jam:</label>
                                <select id="dateFormatInput" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                                    <option value="%d/%m/%Y">%d/%m/%Y (17/09/2026)</option>
                                    <option value="%d-%m-%Y">%d-%m-%Y (17-09-2026)</option>
                                    <option value="%Y-%m-%d">%Y-%m-%d (2026-09-17)</option>
                                    <option value="%d/%m/%Y %H:%M">%d/%m/%Y %H:%M</option>
                                    <option value="%H:%M:%S">%H:%M:%S (Jam)</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 dark:text-slate-500 mb-1 block">Ukuran (pt):</label>
                                <input type="number" id="dateSizeInput" value="20" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>
                        <button onclick="addDateTime()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-xs font-semibold shadow-md shadow-indigo-600/20 transition flex justify-center items-center gap-1.5">
                            <i data-lucide="calendar" class="w-4 h-4"></i> Sisipkan Date / Time
                        </button>
                    </div>

                    <div class="h-[1px] bg-slate-200 dark:bg-slate-800/80"></div>

                    <!-- Variable Block -->
                    <div class="space-y-2.5">
                        <label class="text-[11px] font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase flex items-center gap-1.5">
                            <i data-lucide="code-2" class="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400"></i> Variable (^FN)
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] text-slate-400 dark:text-slate-500 mb-1 block">ID Variabel (^FN):</label>
                                <input type="number" id="varNumberInput" value="1" min="1" max="999" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 dark:text-slate-500 mb-1 block">Default / Field Name:</label>
                                <input type="text" id="varDefaultInput" value="{VAR_PRODUK}" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>
                        <button onclick="addVariable()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-xs font-semibold shadow-md shadow-indigo-600/20 transition flex justify-center items-center gap-1.5">
                            <i data-lucide="code-2" class="w-4 h-4"></i> Sisipkan Variable
                        </button>
                    </div>

                    <div class="h-[1px] bg-slate-200 dark:bg-slate-800/80"></div>

                    <!-- Barcode Block -->
                    <div class="space-y-2.5">
                        <label class="text-[11px] font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase flex items-center gap-1.5">
                            <i data-lucide="barcode" class="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400"></i> Barcode
                        </label>
                        <div>
                            <input type="text" id="barcodeInput" value="1234567890" placeholder="Kode barcode..." class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2.5 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400 dark:text-slate-500 mb-1 block">Simbol / Format Barcode:</label>
                            <select id="barcodeType" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                                <option value="CODE128">Code 128 (Standard)</option>
                                <option value="EAN13">EAN-13</option>
                                <option value="CODE39">Code 39</option>
                            </select>
                        </div>

                                </div>
                                <div>
                                    <label class="text-[10px] text-slate-400 dark:text-slate-500 mb-1 block">Garis (px):</label>
                                    <input type="number" id="editTableBorder" min="1" max="10" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2 text-xs text-slate-800 dark:text-slate-200">
                                </div>
                            </div>
                            <button onclick="applyTableEdit()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-xs font-semibold">Terapkan Tabel</button>
                        </div>
                    </div>

                    <div class="h-[1px] bg-slate-200 dark:bg-slate-800/80"></div>
                    <div class="space-y-2.5">
                        <label class="text-[11px] font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase flex items-center gap-1.5">
                            <i data-lucide="maximize-2" class="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400"></i> Ukuran Canvas (mm) • DPI 203
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] text-slate-400 dark:text-slate-500 mb-1 block">Lebar (mm):</label>
                                <input type="number" id="canvasWidth" value="50.0" step="0.1" min="1" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2 text-xs text-slate-800 dark:text-slate-200">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 dark:text-slate-500 mb-1 block">Tinggi (mm):</label>
                                <input type="number" id="canvasHeight" value="37.5" step="0.1" min="1" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2 text-xs text-slate-800 dark:text-slate-200">
                            </div>
                        </div>
                        <button onclick="updateCanvasSize()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-lg text-xs font-semibold transition">
                            Terapkan Dimensi
                        </button>
                    </div>

                    <div class="h-[1px] bg-slate-200 dark:bg-slate-800/80"></div>

                    <div class="space-y-2">
                        <label class="text-[11px] font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Tampilan Studio</label>
                        <label class="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg cursor-pointer text-xs text-slate-700 dark:text-slate-300">
                            <span>Tampilkan Grid Dots</span>
                            <input type="checkbox" id="gridToggle" onchange="toggleGrid()" checked class="accent-indigo-600">
                        </label>
                    </div>
                </div>

                <!-- TAB 3: LAYERS LIST -->
                <div id="tabLayers" class="hidden space-y-3">
                    <label class="text-[11px] font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase flex items-center justify-between">
                        <span>Urutan Layer</span>
                        <span class="text-[10px] text-slate-400 dark:text-slate-500">Atas -> Bawah</span>
                    </label>
                    
                    <div id="layerListContainer" class="space-y-1.5 max-h-[calc(100vh-220px)] overflow-y-auto pr-1">
                        <!-- Dynamic Layers JS -->
                    </div>
                </div>

            </div>
        </aside>

        <!-- CENTER WORKSPACE VIEWPORT -->
        <main class="flex-1 bg-slate-200 dark:bg-slate-950 bg-grid-pattern relative flex flex-col items-center justify-center overflow-auto p-8 transition-colors" id="workspaceArea">
            
            <!-- Canvas Main Container Shadow Box -->
            <div class="relative inline-block border border-slate-300 dark:border-slate-800 bg-white shadow-2xl rounded-sm">
                
                <!-- Canvas Top Left Corner Indicator -->
                <div class="absolute top-0 left-0 w-6 h-6 bg-slate-100 dark:bg-slate-900 border-r border-b border-slate-300 dark:border-slate-800 z-10 flex items-center justify-center text-[9px] font-mono text-slate-500">mm</div>

                <!-- Studio Rulers -->
                <canvas id="rulerTop" class="absolute top-0 left-6 h-6 border-b border-slate-300 dark:border-slate-800 z-10"></canvas>
                <canvas id="rulerLeft" class="absolute top-6 left-0 w-6 border-r border-slate-300 dark:border-slate-800 z-10"></canvas>

                <!-- Fabric Workspace Area -->
                <div class="pt-6 pl-6">
                    <canvas id="labelCanvas"></canvas>
                </div>
            </div>

            <!-- Floating Studio Status & Zoom Bar -->
            <div class="absolute bottom-4 right-6 bg-white/90 dark:bg-slate-900/90 backdrop-blur border border-slate-200 dark:border-slate-800 px-3.5 py-1.5 rounded-full text-[11px] text-slate-600 dark:text-slate-400 flex items-center gap-3 shadow-2xl z-20 transition-colors">
                <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Canvas Ready</span>
                <span class="border-l border-slate-200 dark:border-slate-800 h-3"></span>
                <span id="canvasDimStatus" class="font-mono">50.0 × 37.5 mm</span>
                <span class="border-l border-slate-200 dark:border-slate-800 h-3"></span>
                
                <!-- ZOOM CONTROLS -->
                <div class="flex items-center gap-1">
                    <button onclick="zoomOut()" title="Zoom Out (-10%)" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded text-slate-700 dark:text-slate-300 transition flex items-center justify-center">
                        <i data-lucide="minus" class="w-3.5 h-3.5"></i>
                    </button>
                    
                    <button onclick="resetZoom()" title="Klik untuk Reset 100%" id="zoomVal" class="font-mono text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 font-semibold text-[11px] px-2 py-0.5 rounded hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                        100%
                    </button>
                    
                    <button onclick="zoomIn()" title="Zoom In (+10%)" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded text-slate-700 dark:text-slate-300 transition flex items-center justify-center">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    </button>

                    <button onclick="fitCanvasToScreen()" title="Sesuaikan Tampilan (Fit Screen)" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition ml-1 border-l border-slate-200 dark:border-slate-800 pl-1.5">
                        <i data-lucide="maximize" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>

            <canvas id="barcodeTempCanvas" class="hidden"></canvas>
            <div id="qrcodeTemp" class="hidden"></div>
        </main>
    </div>

    <!-- MODAL OUTPUT CODE & PREVIEW -->
    <div id="zplModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-md hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-slate-900 rounded-xl w-full max-w-4xl flex flex-col max-h-[90vh] shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
            
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-950">
                <div class="flex items-center gap-2">
                    <i data-lucide="file-code" class="w-5 h-5 text-indigo-600 dark:text-indigo-400"></i>
                    <h3 class="font-semibold text-base text-slate-900 dark:text-white">Kode ZPL II & Simulasi Cetak</h3>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 dark:hover:text-white p-1 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <!-- Modal Content -->
            <div class="p-6 overflow-y-auto flex-1 flex flex-col md:flex-row gap-6 bg-white dark:bg-slate-900">
                <div class="flex-1 flex flex-col">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Source Code ZPL Native:</label>
                        <span class="text-[10px] font-mono text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800/50 px-2 py-0.5 rounded">Ready to Print</span>
                    </div>
                    <textarea id="zplOutput" class="w-full flex-1 bg-slate-900 text-emerald-400 font-mono text-xs p-4 rounded-lg border border-slate-800 h-72 focus:outline-none leading-relaxed" readonly></textarea>
                </div>

                <div class="w-full md:w-80 flex flex-col">
                    <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Simulasi Hasil Printer Zebra:</label>
                    <div class="flex-1 bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-4 flex flex-col items-center justify-center min-h-[220px]">
                        <div id="zplPreviewContainer" class="w-full flex items-center justify-center">
                            <span class="text-xs text-slate-500 flex items-center gap-2"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Rendering Preview...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="px-6 py-4 border-t border-slate-200 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-950">
                <!-- Input IP & Port TCP/IP QZ Tray -->
                <div class="flex items-center gap-2">
                    <input type="text" id="printerIp" placeholder="IP: 192.168.1.100" class="w-36 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2 text-xs focus:outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-200">
                    <input type="text" id="printerPort" value="9100" placeholder="Port" class="w-16 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2 text-xs focus:outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-200">
                    <button onclick="printViaQZ()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium text-xs transition shadow-lg shadow-emerald-600/30 flex items-center gap-1.5">
                        <i data-lucide="printer" class="w-4 h-4"></i> Cetak TCP/IP
                    </button>
                </div>

                <div class="flex gap-2">
                    <button onclick="downloadZPLFile()" class="px-4 py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg font-medium text-xs transition flex items-center gap-1.5">
                        <i data-lucide="download" class="w-4 h-4"></i> Download File .zpl
                    </button>
                    <button onclick="copyZPL()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium text-xs transition shadow-lg shadow-indigo-600/30 flex items-center gap-1.5">
                        <i data-lucide="copy" class="w-4 h-4"></i> Salin Kode
                    </button>
                    <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg font-medium text-xs transition">
                        Tutup
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT ENGINE -->
    
</body>
</html>
