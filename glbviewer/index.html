<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>High-Quality 3D Model Viewer</title>
    
    <!-- Fonts and Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #1a1a2e; /* Dark fallback background */
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at 50% 50%, #2a2a4a 0%, #111122 100%);
        }

        /* Glassmorphism Panel Class */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        /* Spinner Animation */
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #3b82f6; /* Blue-500 */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom Scrollbar for hidden file input */
        #file-input { display: none; }
        
        .pointer-events-none-children > * {
            pointer-events: none;
        }
    </style>
</head>
<body class="text-white antialiased">

    <!-- 3D Canvas Background -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-4 md:p-8">
        
        <!-- Header Panel -->
        <div class="glass-panel rounded-2xl p-6 max-w-sm pointer-events-auto transition-transform duration-300 hover:scale-[1.02]">
            <h1 class="text-2xl font-semibold mb-2 tracking-tight">3D Studio Viewer</h1>
            <p class="text-gray-300 text-sm leading-relaxed">
                Experience high-fidelity PBR lighting. Upload a Blender <span class="font-mono bg-white/10 px-1 rounded text-blue-300">.gltf</span> or <span class="font-mono bg-white/10 px-1 rounded text-blue-300">.glb</span> model to view it in full 3D space.
            </p>
        </div>

        <!-- Controls Panel -->
        <div class="glass-panel rounded-2xl p-5 max-w-sm pointer-events-auto flex flex-col gap-4">
            <button id="upload-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 px-6 rounded-xl font-medium transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-blue-500/30 active:scale-95">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                Upload 3D Model
            </button>
            <input type="file" id="file-input" accept=".gltf, .glb" />
            
            <div class="text-xs text-gray-400 text-center flex justify-center gap-4">
                <span><b class="text-gray-200">Left-Click</b> Orbit</span>
                <span><b class="text-gray-200">Scroll</b> Zoom</span>
            </div>
        </div>
    </div>

    <!-- Drag & Drop Overlay -->
    <div id="drag-overlay" class="absolute inset-0 z-20 bg-gray-900/90 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center">
        <div class="border-4 border-dashed border-blue-500 rounded-3xl p-12 text-center pointer-events-none-children">
            <svg class="w-16 h-16 text-blue-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <h2 class="text-3xl font-bold text-white mb-2">Drop Model Here</h2>
            <p class="text-blue-200">Supports .glb and .gltf from Blender</p>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-overlay" class="absolute inset-0 z-30 bg-[#111122] flex flex-col items-center justify-center transition-all duration-500">
        <div class="spinner mb-6"></div>
        <div id="loading-text" class="text-lg font-medium text-blue-400 tracking-widest uppercase">Initializing Engine...</div>
    </div>
    
    <!-- Error Toast -->
    <div id="error-toast" class="absolute top-6 left-1/2 -translate-x-1/2 z-50 bg-red-600 text-white px-6 py-3 rounded-lg shadow-xl shadow-red-900/50 opacity-0 translate-y-[-20px] pointer-events-none transition-all duration-300 font-medium">
        Error message here
    </div>

    <!-- ES Module Import map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // Core variables
        let scene, camera, renderer, controls;
        let currentModel = null;
        let objectURL = null; 

        // DOM Elements
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const dragOverlay = document.getElementById('drag-overlay');
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const errorToast = document.getElementById('error-toast');

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Renderer Setup (High Quality PBR focus)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.VSMShadowMap; // Very smooth, realistic shadows
            container.appendChild(renderer.domElement);

            // 2. Scene Setup
            scene = new THREE.Scene();

            // Setup RoomEnvironment for beautiful reflections on metallic/glass materials
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            const environment = new RoomEnvironment();
            scene.environment = pmremGenerator.fromScene(environment).texture;
            
            // 3. Camera Setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(8, 4, 8);

            // 4. Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4); // Soft ambient fill
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            
            // Optimize shadow map for high quality
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 25;
            directionalLight.shadow.bias = -0.0001; 
            directionalLight.shadow.blurSamples = 4;
            
            const d = 10;
            directionalLight.shadow.camera.left = -d;
            directionalLight.shadow.camera.right = d;
            directionalLight.shadow.camera.top = d;
            directionalLight.shadow.camera.bottom = -d;
            
            scene.add(directionalLight);

            // 5. Pure White Floor
            const floorGeometry = new THREE.PlaneGeometry(200, 200);
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, // Pure white floor
                roughness: 0.1,  // Slightly reflective
                metalness: 0.0   // Not metallic
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0; 
            floor.receiveShadow = true;
            scene.add(floor);

            // 6. Controls (Global Rotation)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; 
            controls.dampingFactor = 0.05;
            controls.minDistance = 1;
            controls.maxDistance = 50;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent going below the floor
            controls.target.set(0, 2, 0);
            
            // THIS handles the global rotation (camera orbits, object stays still)
            controls.autoRotate = true; 
            controls.autoRotateSpeed = 2.0; 

            // 7. Event Listeners
            window.addEventListener('resize', onWindowResize);
            setupUIHandlers();

            // 8. Create a default shiny object to showcase the environment
            createDefaultObject();

            // Fade out loading screen
            setTimeout(() => {
                loadingOverlay.style.opacity = '0';
                setTimeout(() => loadingOverlay.style.display = 'none', 500);
            }, 800);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function createDefaultObject() {
            // A beautiful geometric group to serve as a placeholder
            const group = new THREE.Group();
            
            const geo1 = new THREE.IcosahedronGeometry(1.5, 0);
            const mat1 = new THREE.MeshStandardMaterial({
                color: 0x3b82f6,
                metalness: 0.8,
                roughness: 0.2,
            });
            const mesh1 = new THREE.Mesh(geo1, mat1);
            mesh1.castShadow = true;
            mesh1.receiveShadow = true;
            mesh1.position.y = 1.5;
            
            const geo2 = new THREE.TorusGeometry(2.5, 0.1, 16, 100);
            const mat2 = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                metalness: 1.0,
                roughness: 0.0,
            });
            const mesh2 = new THREE.Mesh(geo2, mat2);
            mesh2.rotation.x = Math.PI / 2;
            mesh2.position.y = 1.5;
            mesh2.castShadow = true;

            group.add(mesh1);
            group.add(mesh2);
            
            scene.add(group);
            currentModel = group;
        }
        
        function showError(message) {
            errorToast.textContent = message;
            errorToast.style.opacity = '1';
            errorToast.style.transform = 'translate(-50%, 0)';
            setTimeout(() => {
                errorToast.style.opacity = '0';
                errorToast.style.transform = 'translate(-50%, -20px)';
            }, 4000);
        }

        function setupUIHandlers() {
            // Button click triggers file input
            uploadBtn.addEventListener('click', () => {
                fileInput.click();
            });

            // File input change
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) handleFile(file);
                fileInput.value = ''; // Reset
            });

            // Drag and Drop integration
            window.addEventListener('dragover', (e) => {
                e.preventDefault();
                dragOverlay.style.opacity = '1';
                dragOverlay.style.pointerEvents = 'auto';
            });

            window.addEventListener('dragleave', (e) => {
                e.preventDefault();
                // Check if leaving the window completely
                if (!e.relatedTarget || e.relatedTarget.nodeName === "HTML") {
                    dragOverlay.style.opacity = '0';
                    dragOverlay.style.pointerEvents = 'none';
                }
            });

            window.addEventListener('drop', (e) => {
                e.preventDefault();
                dragOverlay.style.opacity = '0';
                dragOverlay.style.pointerEvents = 'none';
                
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    const file = e.dataTransfer.files[0];
                    handleFile(file);
                }
            });
        }

        function handleFile(file) {
            const validExtensions = ['.glb', '.gltf'];
            const fileName = file.name.toLowerCase();
            const isValid = validExtensions.some(ext => fileName.endsWith(ext));

            if (!isValid) {
                showError("Invalid format. Please upload a Blender .glb or .gltf file.");
                return;
            }

            loadingText.textContent = `Loading ${file.name}...`;
            loadingOverlay.style.display = 'flex';
            // Trigger reflow to ensure transition runs
            void loadingOverlay.offsetWidth;
            loadingOverlay.style.opacity = '1';

            if (objectURL) URL.revokeObjectURL(objectURL);
            objectURL = URL.createObjectURL(file);
            
            const loader = new GLTFLoader();

            loader.load(
                objectURL,
                (gltf) => {
                    removeCurrentModel();
                    const model = gltf.scene;
                    
                    // 1. Enable Shadows & Fix Materials
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.material) {
                                // Important for Blender exports to look right in Three.js
                                child.material.needsUpdate = true;
                            }
                        }
                    });

                    // 2. Auto-Centering and Auto-Scaling for robust Blender support
                    
                    // Reset model position before calculations
                    model.position.set(0, 0, 0);
                    model.scale.set(1, 1, 1);
                    model.updateMatrixWorld();

                    // Calculate bounding box
                    const box = new THREE.Box3().setFromObject(model);
                    const size = box.getSize(new THREE.Vector3());
                    const center = box.getCenter(new THREE.Vector3());

                    // Center the model's geometry origin
                    model.position.x -= center.x;
                    model.position.y -= center.y;
                    model.position.z -= center.z;

                    // Scale the model to fit a standard view size (e.g., max dimension = 5 units)
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const targetSize = 5.0; 
                    
                    if (maxDim > 0) {
                        const scaleFactor = targetSize / maxDim;
                        model.scale.setScalar(scaleFactor);
                    }

                    // Update matrices after centering and scaling
                    model.updateMatrixWorld();

                    // Recompute bounding box after scale to position on the floor perfectly
                    const scaledBox = new THREE.Box3().setFromObject(model);
                    
                    // Shift the model up so its lowest point (min.y) rests exactly at y=0 (the white floor)
                    model.position.y -= scaledBox.min.y;

                    scene.add(model);
                    currentModel = model;

                    // 3. Reset Camera & Controls Target
                    camera.position.set(8, 4, 8);
                    
                    // Target the center of the newly scaled model's volume
                    const finalBox = new THREE.Box3().setFromObject(model);
                    const finalCenter = finalBox.getCenter(new THREE.Vector3());
                    controls.target.copy(finalCenter);
                    controls.update();

                    // Hide loading overlay
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => loadingOverlay.style.display = 'none', 500);
                },
                (xhr) => {
                    // Progress callback
                    if (xhr.lengthComputable) {
                        const percentComplete = Math.round((xhr.loaded / xhr.total) * 100);
                        loadingText.textContent = `Loading... ${percentComplete}%`;
                    }
                },
                (error) => {
                    console.error('Error loading Blender model:', error);
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => loadingOverlay.style.display = 'none', 500);
                    showError("Failed to parse the file. Ensure it is a valid Blender GLTF/GLB export.");
                }
            );
        }

        function removeCurrentModel() {
            if (currentModel) {
                scene.remove(currentModel);
                
                // Traverse and dispose to prevent memory leaks in the browser
                currentModel.traverse((child) => {
                    if (child.isMesh) {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(mat => disposeMaterial(mat));
                            } else {
                                disposeMaterial(child.material);
                            }
                        }
                    }
                });
                currentModel = null;
            }
        }
        
        function disposeMaterial(material) {
            material.dispose();
            // Free texture memory
            Object.keys(material).forEach(prop => {
                if (!material[prop]) return;
                if (material[prop] !== null && typeof material[prop].dispose === 'function') {
                    material[prop].dispose();
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // This applies damping and the global autoRotate effect
            controls.update(); 
            
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
