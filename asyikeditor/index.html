<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asyik Editor Pro - Editor Gambar </title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <!-- Fabric.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    
    <!-- Paper.js untuk Operasi Boolean Vektor (Union) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .workspace-bg {
            background-color: #f3f4f6;
            background-image: radial-gradient(#d1d5db 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .toolbar-scroll::-webkit-scrollbar { height: 6px; }
        .toolbar-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        aside::-webkit-scrollbar { width: 4px; }
        aside::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex overflow-hidden font-sans text-gray-800 bg-white">

    <div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 flex flex-col gap-2 z-[100] pointer-events-none"></div>

    <!-- Sidebar KIRI (Menu Utama) -->
    <aside class="w-[280px] bg-white border-r border-gray-200 shadow-sm flex flex-col z-20 shrink-0">
        <div class="p-5 border-b border-gray-100 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-sm">
                    <i data-lucide="pen-tool" class="w-5 h-5"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-900 tracking-tight">Asyik Editor</h1>
            </div>
            <button onclick="clearCanvasStorage()" class="p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition" title="Reset Kanvas & Storage">
                <i data-lucide="trash" class="w-4 h-4"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-5 flex flex-col gap-6">
            <div>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Pengaturan Kanvas</h3>
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 flex flex-col gap-3">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-medium text-gray-700">Warna Latar</span>
                        <input type="color" id="canvasBgColor" value="#ffffff" class="w-6 h-6 cursor-pointer rounded border-0 p-0 bg-transparent">
                    </div>
                    <hr class="border-gray-200">
                    <span class="text-[11px] font-semibold text-gray-500">Preset Ukuran</span>
                    <div class="grid grid-cols-2 gap-1.5">
                        <button onclick="resizeCanvas(800, 600)" class="p-1.5 text-[11px] bg-white hover:bg-indigo-50 hover:text-indigo-600 border border-gray-200 rounded font-medium text-gray-700 transition shadow-sm">Standard</button>
                        <button onclick="resizeCanvas(800, 800)" class="p-1.5 text-[11px] bg-white hover:bg-indigo-50 hover:text-indigo-600 border border-gray-200 rounded font-medium text-gray-700 transition shadow-sm">Square</button>
                        <button onclick="resizeCanvas(600, 1067)" class="p-1.5 text-[11px] bg-white hover:bg-indigo-50 hover:text-indigo-600 border border-gray-200 rounded font-medium text-gray-700 transition shadow-sm">Story</button>
                        <button onclick="resizeCanvas(1000, 562)" class="p-1.5 text-[11px] bg-white hover:bg-indigo-50 hover:text-indigo-600 border border-gray-200 rounded font-medium text-gray-700 transition shadow-sm">Landscape</button>
                    </div>
                    <div class="flex items-center gap-1.5 mt-1">
                        <input type="number" id="customWidth" placeholder="W" value="800" class="w-full border border-gray-200 p-1.5 rounded text-xs bg-white focus:outline-indigo-500">
                        <span class="text-gray-400 text-xs">×</span>
                        <input type="number" id="customHeight" placeholder="H" value="600" class="w-full border border-gray-200 p-1.5 rounded text-xs bg-white focus:outline-indigo-500">
                        <button onclick="applyCustomSize()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-semibold transition">Atur</button>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Media</h3>
                <input type="file" id="imageUpload" class="hidden" accept="image/*">
                <button onclick="document.getElementById('imageUpload').click()" class="w-full flex items-center justify-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 p-2.5 rounded-lg border border-indigo-100 transition font-medium">
                    <i data-lucide="upload" class="w-4 h-4"></i> Upload Gambar
                </button>
            </div>

            <div>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Tipografi</h3>
                <div class="flex flex-col gap-2">
                    <button onclick="addText('heading')" class="w-full flex items-center gap-3 text-left p-3 border border-transparent hover:border-gray-200 bg-gray-50 hover:bg-white rounded-lg transition">
                        <i data-lucide="type" class="w-5 h-5 text-gray-500"></i>
                        <span class="font-bold text-lg text-gray-900">Heading</span>
                    </button>
                    <button onclick="addText('subheading')" class="w-full flex items-center gap-3 text-left p-3 border border-transparent hover:border-gray-200 bg-gray-50 hover:bg-white rounded-lg transition">
                        <i data-lucide="type" class="w-4 h-4 text-gray-500"></i>
                        <span class="font-medium text-sm text-gray-700">Subheading</span>
                    </button>
                </div>
            </div>

            <div>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Bentuk & Garis</h3>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="addShape('rect')" class="py-3 px-2 bg-gray-50 hover:bg-white hover:shadow-sm border border-transparent hover:border-gray-200 rounded-lg flex flex-col justify-center items-center transition gap-1.5" title="Persegi">
                        <i data-lucide="square" class="w-5 h-5 text-gray-600"></i>
                        <span class="text-[10px] font-medium text-gray-600">Persegi</span>
                    </button>
                    <button onclick="addShape('circle')" class="py-3 px-2 bg-gray-50 hover:bg-white hover:shadow-sm border border-transparent hover:border-gray-200 rounded-lg flex flex-col justify-center items-center transition gap-1.5" title="Lingkaran">
                        <i data-lucide="circle" class="w-5 h-5 text-gray-600"></i>
                        <span class="text-[10px] font-medium text-gray-600">Bulat</span>
                    </button>
                    <button onclick="addShape('triangle')" class="py-3 px-2 bg-gray-50 hover:bg-white hover:shadow-sm border border-transparent hover:border-gray-200 rounded-lg flex flex-col justify-center items-center transition gap-1.5" title="Segitiga">
                        <i data-lucide="triangle" class="w-5 h-5 text-gray-600"></i>
                        <span class="text-[10px] font-medium text-gray-600">Segitiga</span>
                    </button>
                    <button onclick="addShape('hexagon')" class="py-3 px-2 bg-gray-50 hover:bg-white hover:shadow-sm border border-transparent hover:border-gray-200 rounded-lg flex flex-col justify-center items-center transition gap-1.5" title="Hexagon">
                        <i data-lucide="hexagon" class="w-5 h-5 text-gray-600"></i>
                        <span class="text-[10px] font-medium text-gray-600">Hexagon</span>
                    </button>
                    <button onclick="addLine()" class="py-3 px-2 bg-gray-50 hover:bg-white hover:shadow-sm border border-transparent hover:border-gray-200 rounded-lg flex flex-col justify-center items-center transition gap-1.5" title="Garis">
                        <i data-lucide="minus" class="w-5 h-5 text-gray-600"></i>
                        <span class="text-[10px] font-medium text-gray-600">Garis</span>
                    </button>
                    <button id="polylineBtn" onclick="startPolyline()" class="py-3 px-2 bg-gray-50 hover:bg-white hover:shadow-sm border border-transparent hover:border-gray-200 rounded-lg flex flex-col justify-center items-center transition gap-1.5" title="Multiline">
                        <i data-lucide="waypoints" class="w-5 h-5 text-gray-600"></i>
                        <span class="text-[10px] font-medium text-gray-600">Multiline</span>
                    </button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Workspace (Tengah) -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        
        <!-- Header / Global Tools -->
        <header class="h-16 bg-white border-b border-gray-200 shadow-sm flex items-center justify-between px-4 z-10 shrink-0">
            
            <!-- Drawing & Fill Tools -->
            <div class="flex items-center gap-1.5">
                <button id="fillBucketBtn" class="flex items-center gap-1.5 px-3 py-1.5 text-sm bg-gray-50 hover:bg-gray-100 text-gray-700 border border-gray-200 rounded-lg font-medium transition" title="Paint Bucket (Isi Warna)">
                    <i data-lucide="paint-bucket" class="w-4 h-4"></i> Fill Color
                </button>
                <button id="drawBtn" class="flex items-center gap-1.5 px-3 py-1.5 text-sm bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-lg font-medium transition" title="Draw">
                    <i data-lucide="brush" class="w-4 h-4"></i> Draw
                </button>
                <button id="eraserBtn" class="flex items-center gap-1.5 px-3 py-1.5 text-sm bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 rounded-lg font-medium transition" title="Eraser">
                    <i data-lucide="eraser" class="w-4 h-4"></i> Eraser
                </button>
            </div>

            <!-- Global Actions -->
            <div class="flex items-center gap-1.5 shrink-0">
                <button id="undoBtn" class="p-1.5 text-gray-500 hover:bg-gray-100 rounded-md transition opacity-50 cursor-not-allowed" title="Undo (Ctrl+Z)" disabled><i data-lucide="undo" class="w-5 h-5"></i></button>
                <button id="redoBtn" class="p-1.5 text-gray-500 hover:bg-gray-100 rounded-md transition opacity-50 cursor-not-allowed" title="Redo (Ctrl+Y)" disabled><i data-lucide="redo" class="w-5 h-5"></i></button>
                <div class="w-px h-6 bg-gray-200 mx-1"></div>
                
                <button onclick="saveProjectAsk()" class="flex items-center gap-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-semibold transition" title="Simpan Project (.ask)">
                    <i data-lucide="save" class="w-4 h-4"></i> Save .ask
                </button>
                <input type="file" id="askUpload" class="hidden" accept=".ask">
                <button onclick="document.getElementById('askUpload').click()" class="flex items-center gap-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-semibold transition" title="Buka Project (.ask)">
                    <i data-lucide="folder-open" class="w-4 h-4"></i> Buka .ask
                </button>

                <button onclick="downloadCanvas()" class="flex items-center gap-1.5 ml-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-lg shadow-sm text-sm font-semibold transition">
                    <i data-lucide="download" class="w-4 h-4"></i> Export PNG
                </button>
            </div>
        </header>

        <!-- Area Canvas -->
        <div class="flex-1 overflow-auto workspace-bg flex justify-center items-center p-8 relative" id="canvasContainer">
            
            <!-- Crop Controls Floating UI -->
            <div id="cropControls" class="hidden absolute top-6 left-1/2 -translate-x-1/2 bg-white/95 backdrop-blur-sm px-4 py-2.5 rounded-xl shadow-2xl border border-emerald-200 z-50 items-center gap-3">
                <div class="flex items-center gap-1.5">
                    <div class="w-6 h-6 bg-emerald-100 text-emerald-600 rounded flex items-center justify-center">
                        <i data-lucide="crop" class="w-3.5 h-3.5"></i>
                    </div>
                    <span class="text-sm font-bold text-gray-800">Mode Crop Aktif</span>
                </div>
                <div class="w-px h-5 bg-gray-300 mx-1"></div>
                <button onclick="applyCrop()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg transition shadow-sm">
                    Terapkan
                </button>
                <button onclick="cancelCrop()" class="px-4 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold rounded-lg transition">
                    Batal
                </button>
            </div>

            <div class="bg-white shadow-2xl relative border border-gray-200" id="canvasWrapper">
                <canvas id="canvas"></canvas>
            </div>

            <!-- Kontrol Tampilan & Zoom -->
            <div class="absolute bottom-6 right-6 bg-white/90 backdrop-blur-sm p-1.5 rounded-xl shadow-lg border border-gray-200 flex items-center gap-1 z-20">
                <button id="snapToggleBtn" class="flex items-center gap-1.5 px-3 py-1.5 text-sm bg-indigo-50 text-indigo-600 hover:bg-gray-100 hover:text-gray-600 rounded-lg font-medium transition" title="Smart Guides">
                    <i data-lucide="magnet" class="w-4 h-4"></i> Snap
                </button>
                <div class="w-px h-5 bg-gray-300 mx-1"></div>
                
                <button id="gridToggleBtn" class="flex items-center gap-1.5 px-3 py-1.5 text-sm bg-transparent hover:bg-gray-100 text-gray-600 rounded-lg font-medium transition" title="Grid Penggaris">
                    <i data-lucide="grid-3x3" class="w-4 h-4"></i> Grid
                </button>
                <div class="w-px h-5 bg-gray-300 mx-1"></div>
                
                <button onclick="changeZoom(-0.1)" class="w-8 h-8 flex items-center justify-center hover:bg-gray-100 rounded-lg font-bold text-gray-600">-</button>
                <span id="zoomLabel" class="text-xs font-semibold w-12 text-center cursor-pointer hover:text-indigo-600 select-none" onclick="resetZoom()">100%</span>
                <button onclick="changeZoom(0.1)" class="w-8 h-8 flex items-center justify-center hover:bg-gray-100 rounded-lg font-bold text-gray-600">+</button>
            </div>
        </div>
    </main>

    <!-- Sidebar KANAN (Edit Object Properties) -->
    <aside id="rightSidebar" class="w-[280px] bg-white border-l border-gray-200 shadow-sm flex flex-col z-20 shrink-0 opacity-50 pointer-events-none transition-opacity duration-300">
        <div class="p-4 border-b border-gray-100 shrink-0">
            <h2 class="text-sm font-bold text-gray-900 flex items-center gap-2">
                <i data-lucide="sliders-horizontal" class="w-4 h-4 text-indigo-600"></i> Properti Objek
            </h2>
            <p class="text-[11px] text-gray-500 mt-1" id="objectTypeLabel">Pilih objek di kanvas</p>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-6">
            
            <!-- Text Formatting Tools -->
            <div id="textTools" class="flex-col gap-3 hidden">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">Font & Gaya</label>
                    <select id="fontFamily" class="w-full border border-gray-200 p-2 rounded-lg outline-none bg-gray-50 text-sm font-medium focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                        <option value="Inter">Inter</option>
                        <option value="Arial">Arial</option>
                        <option value="Georgia">Georgia</option>
                    </select>
                </div>
                <div class="flex items-center justify-between bg-gray-50 p-1 rounded-lg border border-gray-200">
                    <button id="btnBold" class="flex-1 py-1.5 text-gray-700 hover:bg-white hover:shadow-sm rounded transition border border-transparent flex justify-center" title="Bold"><i data-lucide="bold" class="w-4 h-4"></i></button>
                    <button id="btnItalic" class="flex-1 py-1.5 text-gray-700 hover:bg-white hover:shadow-sm rounded transition border border-transparent flex justify-center" title="Italic"><i data-lucide="italic" class="w-4 h-4"></i></button>
                    <button id="btnUnderline" class="flex-1 py-1.5 text-gray-700 hover:bg-white hover:shadow-sm rounded transition border border-transparent flex justify-center" title="Underline"><i data-lucide="underline" class="w-4 h-4"></i></button>
                </div>
                <div class="flex items-center justify-between bg-gray-50 p-1 rounded-lg border border-gray-200">
                    <button id="btnAlignLeft" class="flex-1 py-1.5 text-gray-700 hover:bg-white hover:shadow-sm rounded transition border border-transparent flex justify-center" title="Rata Kiri"><i data-lucide="align-left" class="w-4 h-4"></i></button>
                    <button id="btnAlignCenter" class="flex-1 py-1.5 text-gray-700 hover:bg-white hover:shadow-sm rounded transition border border-transparent flex justify-center" title="Rata Tengah"><i data-lucide="align-center" class="w-4 h-4"></i></button>
                    <button id="btnAlignRight" class="flex-1 py-1.5 text-gray-700 hover:bg-white hover:shadow-sm rounded transition border border-transparent flex justify-center" title="Rata Kanan"><i data-lucide="align-right" class="w-4 h-4"></i></button>
                </div>
                <hr class="border-gray-100 my-1">
            </div>

            <!-- Appearance (Color, Stroke, Opacity) -->
            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2.5 block">Penampilan</label>
                <div class="flex flex-col gap-3.5">
                    <div class="flex items-center justify-between bg-gray-50 p-2 rounded-lg border border-gray-100" id="fillContainer">
                        <span class="text-xs font-medium text-gray-700">Warna Isi</span>
                        <input type="color" id="fillColor" value="#e0e7ff" class="w-7 h-7 cursor-pointer rounded border-0 p-0 bg-transparent">
                    </div>
                    <div class="flex items-center justify-between bg-gray-50 p-2 rounded-lg border border-gray-100">
                        <span class="text-xs font-medium text-gray-700">Warna Garis</span>
                        <input type="color" id="strokeColor" value="#4f46e5" class="w-7 h-7 cursor-pointer rounded border-0 p-0 bg-transparent">
                    </div>
                    <div class="flex items-center justify-between gap-3 px-1" id="strokeWidthContainer">
                        <span class="text-xs font-medium text-gray-500 whitespace-nowrap" title="Tebal Garis"><i data-lucide="grip-horizontal" class="w-4 h-4"></i></span>
                        <input type="range" id="strokeWidth" min="0" max="30" value="2" class="w-full cursor-pointer accent-indigo-600">
                    </div>
                    <div class="flex items-center justify-between gap-3 px-1 hidden" id="radiusContainer">
                        <span class="text-xs font-medium text-gray-500 whitespace-nowrap" title="Lengkung Sudut"><i data-lucide="squircle" class="w-4 h-4"></i></span>
                        <input type="range" id="cornerRadius" min="0" max="100" value="0" class="w-full cursor-pointer accent-indigo-600">
                    </div>
                    <div class="flex items-center justify-between gap-3 px-1">
                        <span class="text-xs font-medium text-gray-500 whitespace-nowrap" title="Transparansi (Opacity)"><i data-lucide="blend" class="w-4 h-4"></i></span>
                        <input type="range" id="opacitySlider" min="0" max="100" value="100" class="w-full cursor-pointer accent-indigo-600">
                    </div>
                </div>
            </div>

            <hr class="border-gray-100">

            <!-- Effects -->
            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2.5 block">Efek Visual</label>
                <div class="grid grid-cols-2 gap-2">
                    <button id="toggleDashBtn" class="flex flex-col items-center justify-center gap-1.5 p-2.5 bg-gray-50 hover:bg-gray-100 text-gray-700 text-[11px] font-medium rounded-lg transition border border-gray-200">
                        <i data-lucide="more-horizontal" class="w-4 h-4 text-gray-500"></i> Garis Putus
                    </button>
                    <button id="toggleShadowBtn" class="flex flex-col items-center justify-center gap-1.5 p-2.5 bg-gray-50 hover:bg-gray-100 text-gray-700 text-[11px] font-medium rounded-lg transition border border-gray-200">
                        <i data-lucide="box" class="w-4 h-4 text-gray-500"></i> Bayangan
                    </button>
                </div>
            </div>

            <hr class="border-gray-100">

            <!-- Advanced Image Tools -->
            <div id="imageToolsContainer" class="hidden flex-col gap-2">
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block text-purple-600">Alat Gambar & AI</label>
                <button id="removeBgBtn" class="w-full flex items-center justify-center gap-2 px-3 py-2 text-sm bg-purple-50 hover:bg-purple-100 border border-purple-200 text-purple-700 rounded-lg font-semibold transition shadow-sm">
                    <i data-lucide="wand-2" class="w-4 h-4"></i> Hapus Background
                </button>
                <button id="cropBtn" onclick="startCrop()" class="w-full flex items-center justify-center gap-2 px-3 py-2 text-sm bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 rounded-lg font-semibold transition shadow-sm">
                    <i data-lucide="crop" class="w-4 h-4"></i> Potong Gambar
                </button>
                <hr class="border-gray-100 my-2">
            </div>

            <!-- Arrangement / Actions -->
            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2.5 block">Aksi Lanjutan</label>
                
                <div class="grid grid-cols-4 gap-1.5 mb-1.5">
                    <button onclick="bringForward()" class="p-2 bg-gray-50 hover:bg-white hover:shadow-sm text-gray-700 rounded-lg flex justify-center transition border border-gray-200" title="Naik Layer"><i data-lucide="arrow-up" class="w-4 h-4"></i></button>
                    <button onclick="sendBackward()" class="p-2 bg-gray-50 hover:bg-white hover:shadow-sm text-gray-700 rounded-lg flex justify-center transition border border-gray-200" title="Turun Layer"><i data-lucide="arrow-down" class="w-4 h-4"></i></button>
                    <button onclick="toggleLock()" id="lockBtn" class="p-2 bg-gray-50 hover:bg-white hover:shadow-sm text-gray-700 rounded-lg flex justify-center transition border border-gray-200" title="Kunci"><i data-lucide="lock" class="w-4 h-4"></i></button>
                    <button onclick="deleteObject()" class="p-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg flex justify-center transition border border-red-100" title="Hapus"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
                
                <div class="grid grid-cols-3 gap-1.5 mb-3">
                    <button onclick="groupObjects()" class="py-1.5 text-[10px] font-bold uppercase tracking-wide bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-100 rounded-md transition" title="Group">Group</button>
                    <button onclick="ungroupObjects()" class="py-1.5 text-[10px] font-bold uppercase tracking-wide bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-100 rounded-md transition" title="Ungroup">Ungrp</button>
                    <button onclick="unionObjects()" class="py-1.5 text-[10px] font-bold uppercase tracking-wide bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-100 rounded-md transition" title="Union Vektor">Union</button>
                </div>
                
                <div class="grid grid-cols-3 gap-1.5">
                    <button onclick="copyObject()" class="py-2 flex flex-col items-center justify-center gap-1 text-[10px] font-medium bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-md transition"><i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy</button>
                    <button onclick="pasteObject()" class="py-2 flex flex-col items-center justify-center gap-1 text-[10px] font-medium bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-md transition"><i data-lucide="clipboard-paste" class="w-3.5 h-3.5"></i> Paste</button>
                    <button onclick="duplicateObject()" class="py-2 flex flex-col items-center justify-center gap-1 text-[10px] font-medium bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-md transition"><i data-lucide="copy-plus" class="w-3.5 h-3.5"></i> Dupes</button>
                </div>
            </div>

        </div>
    </aside>

    <!-- JavaScript Logic -->
    <script>
        lucide.createIcons();

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-red-600' : 'bg-gray-900';
            const iconName = type === 'error' ? 'alert-circle' : 'info';
            
            toast.className = `px-4 py-2.5 rounded-lg shadow-xl text-sm font-medium text-white transition-all duration-300 transform translate-y-8 opacity-0 flex items-center gap-2.5 ${bgClass}`;
            toast.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4 text-white/80"></i> ${message}`;
            container.appendChild(toast);
            lucide.createIcons({root: toast});
            
            requestAnimationFrame(() => toast.classList.remove('translate-y-8', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-y-8', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        const canvas = new fabric.Canvas('canvas', {
            width: 800, height: 600, backgroundColor: '#ffffff',
            preserveObjectStacking: true, selectionColor: 'rgba(79, 70, 229, 0.1)', selectionBorderColor: '#4f46e5'
        });

        fabric.Object.prototype.set({
            transparentCorners: false, cornerColor: '#ffffff', cornerStrokeColor: '#4f46e5',
            borderColor: '#4f46e5', cornerSize: 10, padding: 5, cornerStyle: 'circle'
        });

        let baseWidth = 800;
        let baseHeight = 600;
        let currentZoom = 1;

        const canvasBgColorInput = document.getElementById('canvasBgColor');
        canvasBgColorInput.addEventListener('input', (e) => {
            canvas.setBackgroundColor(e.target.value, canvas.renderAll.bind(canvas));
            saveHistory();
        });

        function applyZoom(z) {
            currentZoom = Math.max(0.1, Math.min(5, z));
            zoomLabel.innerText = Math.round(currentZoom * 100) + '%';
            
            const newWidth = Math.round(baseWidth * currentZoom);
            const newHeight = Math.round(baseHeight * currentZoom);
            
            canvas.setWidth(newWidth);
            canvas.setHeight(newHeight);
            canvas.setZoom(currentZoom);
            canvas.renderAll();
        }

        function changeZoom(inc) { 
            applyZoom(currentZoom + inc);
            saveHistory();
        }

        function resetZoom() { 
            applyZoom(1);
            saveHistory();
        }

        function resizeCanvas(width, height) {
            baseWidth = width;
            baseHeight = height;
            applyZoom(currentZoom);
            document.getElementById('customWidth').value = width;
            document.getElementById('customHeight').value = height;
            saveHistory();
            showToast(`Ukuran kanvas diubah ke ${width}×${height}px`);
        }

        function applyCustomSize() {
            const w = parseInt(document.getElementById('customWidth').value) || 800;
            const h = parseInt(document.getElementById('customHeight').value) || 600;
            resizeCanvas(w, h);
        }

        let history = [], historyIndex = -1, isHistoryAction = false;
        const undoBtn = document.getElementById('undoBtn'), redoBtn = document.getElementById('redoBtn');
        const zoomLabel = document.getElementById('zoomLabel');

        function getFullCanvasState() {
            return {
                json: canvas.toJSON(['excludeFromExport']),
                zoom: currentZoom,
                baseWidth: baseWidth,
                baseHeight: baseHeight,
                vpt: [...canvas.viewportTransform],
                width: canvas.width,
                height: canvas.height,
                bgColor: canvas.backgroundColor
            };
        }

        function saveHistory() {
            if (isHistoryAction) return;
            if (historyIndex < history.length - 1) history = history.slice(0, historyIndex + 1);
            
            const stateObj = getFullCanvasState();
            const stateString = JSON.stringify(stateObj);
            
            history.push(stateString); 
            historyIndex++; 
            updateHistoryButtons();
            
            localStorage.setItem('minicanva_full_state', stateString); 
        }

        function clearCanvasStorage() {
            if (confirm("Reset seluruh kanvas dan hapus data tersimpan?")) {
                localStorage.removeItem('minicanva_full_state');
                canvas.clear();
                canvas.backgroundColor = '#ffffff';
                baseWidth = 800;
                baseHeight = 600;
                applyZoom(1);
                zoomLabel.innerText = '100%';
                canvas.renderAll();
                canvasBgColorInput.value = '#ffffff';
                history = [];
                historyIndex = -1;
                saveHistory();
                showToast("Kanvas berhasil direset");
            }
        }

        const savedStateString = localStorage.getItem('minicanva_full_state');
        if (savedStateString) {
            try {
                const parsedState = JSON.parse(savedStateString);
                isHistoryAction = true;
                
                if (parsedState.baseWidth && parsedState.baseHeight) {
                    baseWidth = parsedState.baseWidth;
                    baseHeight = parsedState.baseHeight;
                    document.getElementById('customWidth').value = baseWidth;
                    document.getElementById('customHeight').value = baseHeight;
                }
                if (parsedState.zoom) {
                    currentZoom = parsedState.zoom;
                }

                canvas.loadFromJSON(parsedState.json, () => {
                    applyZoom(currentZoom);
                    if (parsedState.vpt) {
                        canvas.setViewportTransform(parsedState.vpt);
                    }
                    
                    canvas.renderAll();
                    isHistoryAction = false;
                    history.push(savedStateString);
                    historyIndex = 0;
                    updateHistoryButtons();

                    if (canvas.backgroundColor) {
                        canvasBgColorInput.value = typeof canvas.backgroundColor === 'string' ? canvas.backgroundColor : '#ffffff';
                    }
                });
            } catch (e) {
                console.error("Gagal memuat state", e);
                saveHistory();
            }
        } else {
            saveHistory(); 
        }

        function undo() { 
            if(historyIndex > 0) { 
                isHistoryAction = true; 
                historyIndex--; 
                restoreStateFromString(history[historyIndex]);
                updateHistoryButtons(); 
            } 
        }

        function redo() { 
            if(historyIndex < history.length - 1) { 
                isHistoryAction = true; 
                historyIndex++; 
                restoreStateFromString(history[historyIndex]);
                updateHistoryButtons(); 
            } 
        }

        function restoreStateFromString(stateStr) {
            const parsed = JSON.parse(stateStr);
            if (parsed.baseWidth && parsed.baseHeight) {
                baseWidth = parsed.baseWidth;
                baseHeight = parsed.baseHeight;
                document.getElementById('customWidth').value = baseWidth;
                document.getElementById('customHeight').value = baseHeight;
            }
            if (parsed.zoom) {
                currentZoom = parsed.zoom;
            }
            canvas.loadFromJSON(parsed.json, () => {
                applyZoom(currentZoom);
                if (parsed.vpt) {
                    canvas.setViewportTransform(parsed.vpt);
                }
                canvas.renderAll();
                isHistoryAction = false;
                localStorage.setItem('minicanva_full_state', stateStr);
                if(canvas.backgroundColor) canvasBgColorInput.value = typeof canvas.backgroundColor === 'string' ? canvas.backgroundColor : '#ffffff';
                if(isGridVisible) drawGrid(); 
            });
        }

        function updateHistoryButtons() {
            undoBtn.disabled = historyIndex <= 0; 
            undoBtn.classList.toggle('opacity-50', historyIndex <= 0); 
            undoBtn.classList.toggle('cursor-not-allowed', historyIndex <= 0);
            
            redoBtn.disabled = historyIndex >= history.length - 1; 
            redoBtn.classList.toggle('opacity-50', historyIndex >= history.length - 1); 
            redoBtn.classList.toggle('cursor-not-allowed', historyIndex >= history.length - 1);
        }

        canvas.on('object:modified', saveHistory); 
        canvas.on('object:added', (e) => { if(!isHistoryAction && !e.target.excludeFromExport && !isDrawingPolyline && !isCropping) setTimeout(saveHistory, 100); });
        canvas.on('object:removed', (e) => { if(!isHistoryAction && !e.target.excludeFromExport && !isCropping) saveHistory(); });
        canvas.on('path:created', saveHistory);
        undoBtn.addEventListener('click', undo); 
        redoBtn.addEventListener('click', redo);


        function groupObjects() {
            if (!canvas.getActiveObject() || canvas.getActiveObject().type !== 'activeSelection') {
                showToast('Pilih lebih dari satu objek untuk di-Group!', 'error');
                return;
            }
            const group = canvas.getActiveObject().toGroup();
            canvas.renderAll();
            saveHistory();
            showToast('Objek berhasil di-Group');
        }

        function ungroupObjects() {
            const obj = canvas.getActiveObject();
            if (!obj || obj.type !== 'group') {
                showToast('Pilih objek Group untuk di-Ungroup!', 'error');
                return;
            }
            obj.toActiveSelection();
            canvas.renderAll();
            saveHistory();
            showToast('Objek berhasil di-Ungroup');
        }

        function unionObjects() {
            const activeObj = canvas.getActiveObject();
            if (!activeObj || activeObj.type !== 'activeSelection') {
                showToast('Pilih beberapa objek vektor secara bersamaan untuk di-Union!', 'error');
                return;
            }
            const objects = activeObj.getObjects();
            if (objects.length < 2) {
                showToast('Pilih minimal 2 objek untuk melakukan Union!', 'error');
                return;
            }

            const validVectorTypes = ['rect', 'circle', 'triangle', 'polygon', 'path', 'polyline', 'line', 'group'];
            for (let i = 0; i < objects.length; i++) {
                if (!validVectorTypes.includes(objects[i].type)) {
                    showToast(`Objek "${objects[i].type}" bukan vektor valid!`, 'error');
                    return;
                }
            }

            showToast('Memproses Union...');
            const primaryFill = objects[0].fill || '#e0e7ff';
            const primaryStroke = objects[0].stroke || '#4f46e5';
            const primaryStrokeWidth = objects[0].strokeWidth || 2;
            canvas.discardActiveObject();

            setTimeout(() => {
                try {
                    if (!window.paperScopeInitialized) {
                        const paperCanvas = document.createElement('canvas');
                        paper.setup(paperCanvas);
                        window.paperScopeInitialized = true;
                    }
                    paper.project.clear();
                    let allPaths = [];

                    for (let i = 0; i < objects.length; i++) {
                        const obj = objects[i];
                        obj.setCoords(); 
                        const svgStr = `<svg xmlns="http://www.w3.org/2000/svg">${obj.toSVG()}</svg>`;
                        const imported = paper.project.importSVG(svgStr, { expandShapes: true });
                        if (!imported) continue;

                        const shapes = imported.getItems({ class: paper.Shape });
                        const paths = imported.getItems({ class: paper.Path });
                        const compoundPaths = imported.getItems({ class: paper.CompoundPath });

                        shapes.forEach(shape => allPaths.push(shape.toPath().clone()));
                        paths.forEach(path => allPaths.push(path.clone()));
                        compoundPaths.forEach(cPath => allPaths.push(cPath.clone()));
                    }

                    if (allPaths.length === 0) {
                        showToast('Gagal memproses penggabungan vektor (Bentuk tidak dikenali).', 'error');
                        const sel = new fabric.ActiveSelection(objects, { canvas: canvas });
                        canvas.setActiveObject(sel);
                        canvas.requestRenderAll();
                        return;
                    }

                    let unionedItem = allPaths[0];
                    for (let i = 1; i < allPaths.length; i++) {
                        try {
                            const merged = unionedItem.unite(allPaths[i], { insert: false });
                            if (merged) unionedItem = merged;
                        } catch (e) {
                            console.warn("Melewati potongan path:", e);
                        }
                    }

                    if (!unionedItem) {
                        showToast('Gagal melakukan Union pada bentuk tersebut.', 'error');
                        return;
                    }

                    const pathSvgStr = unionedItem.exportSVG({ asString: true });
                    const finalSvg = `<svg xmlns="http://www.w3.org/2000/svg">${pathSvgStr}</svg>`;

                    fabric.loadSVGFromString(finalSvg, function(results, options) {
                        if (!results || results.length === 0) return;
                        const unionShape = fabric.util.groupSVGElements(results, options);
                        unionShape.set({ fill: primaryFill, stroke: primaryStroke, strokeWidth: primaryStrokeWidth });
                        objects.forEach(o => canvas.remove(o));
                        canvas.add(unionShape);
                        canvas.setActiveObject(unionShape);
                        canvas.renderAll();
                        saveHistory();
                        showToast('Union objek berhasil!');
                    });
                } catch (err) {
                    console.error("Union Error:", err);
                    showToast('Gagal melakukan Union: Struktur vektor terlalu kompleks.', 'error');
                }
            }, 50);
        }
        
        function toggleLock() {
            const obj = canvas.getActiveObject();
            if (!obj) return;
            const isLocked = obj.lockMovementX;
            obj.set({
                lockMovementX: !isLocked, lockMovementY: !isLocked,
                lockScalingX: !isLocked, lockScalingY: !isLocked,
                lockRotating: !isLocked, hasControls: isLocked
            });
            canvas.requestRenderAll(); saveHistory();
            showToast(isLocked ? 'Objek dibuka (Unlocked)' : 'Objek dikunci (Locked)');
            updateToolbar();
        }

        let _clipboard = null;

        function copyObject() {
            if(!canvas.getActiveObject() || isCropping) return;
            canvas.getActiveObject().clone(function(cloned) {
                _clipboard = cloned; showToast("Objek disalin");
            });
        }

        function pasteObject() {
            if (!_clipboard || isCropping) return;
            _clipboard.clone(function(clonedObj) {
                canvas.discardActiveObject();
                clonedObj.set({ left: clonedObj.left + 20, top: clonedObj.top + 20, evented: true });
                if (clonedObj.type === 'activeSelection') {
                    clonedObj.canvas = canvas;
                    clonedObj.forEachObject(function(obj) { canvas.add(obj); });
                    clonedObj.setCoords();
                } else { canvas.add(clonedObj); }
                _clipboard.top += 20; _clipboard.left += 20;
                canvas.setActiveObject(clonedObj); canvas.requestRenderAll(); saveHistory();
                showToast("Objek ditempel");
            });
        }

        function duplicateObject() {
            const actObj = canvas.getActiveObject();
            if (!actObj || isCropping) return;
            actObj.clone(function(cloned) {
                canvas.discardActiveObject();
                cloned.set({ left: actObj.left + 20, top: actObj.top + 20, evented: true });
                if (cloned.type === 'activeSelection') {
                    cloned.canvas = canvas;
                    cloned.forEachObject(function(obj) { canvas.add(obj); });
                    cloned.setCoords();
                } else { canvas.add(cloned); }
                canvas.setActiveObject(cloned); canvas.requestRenderAll(); saveHistory();
                showToast("Objek diduplikasi");
            });
        }

        function deleteObject() {
            if (isCropping) return;
            const activeObjects = canvas.getActiveObjects();
            if (activeObjects.length) {
                canvas.discardActiveObject();
                activeObjects.forEach(function(object) { canvas.remove(object); });
                saveHistory(); showToast("Objek dihapus");
            }
        }

        let isSnapEnabled = true;
        const snapZone = 10;
        const snapColor = '#ec4899';
        let guideLines = [];
        const snapToggleBtn = document.getElementById('snapToggleBtn');
        snapToggleBtn.addEventListener('click', () => {
            isSnapEnabled = !isSnapEnabled;
            if (isSnapEnabled) {
                snapToggleBtn.classList.add('bg-indigo-50', 'text-indigo-600');
                snapToggleBtn.classList.remove('bg-transparent', 'text-gray-600');
                showToast("Object Snap Aktif");
            } else {
                snapToggleBtn.classList.remove('bg-indigo-50', 'text-indigo-600');
                snapToggleBtn.classList.add('bg-transparent', 'text-gray-600');
                showToast("Object Snap Dimatikan");
            }
        });

        function clearGuidelines() {
            guideLines.forEach(l => canvas.remove(l));
            guideLines = [];
        }

        function drawGuideLine(type, position) {
            let line = new fabric.Line(
                type === 'vertical' ? [position, 0, position, canvas.height] : [0, position, canvas.width, position],
                { stroke: snapColor, strokeWidth: 1, strokeDashArray: [5, 5], selectable: false, evented: false, excludeFromExport: true }
            );
            guideLines.push(line); canvas.add(line); canvas.sendToBack(line);
        }

        canvas.on('object:moving', function(e) {
            if (!isSnapEnabled || isCropping) return;
            clearGuidelines();
            const obj = e.target;
            const objCenter = obj.getCenterPoint();
            const objBound = obj.getBoundingRect();
            let snappedX = false, snappedY = false;

            const snapX = (targetX) => {
                if (snappedX) return;
                if (Math.abs(objCenter.x - targetX) < snapZone) {
                    obj.set('left', obj.left + (targetX - objCenter.x));
                    drawGuideLine('vertical', targetX); snappedX = true;
                }
            };
            const snapY = (targetY) => {
                if (snappedY) return;
                if (Math.abs(objCenter.y - targetY) < snapZone) {
                    obj.set('top', obj.top + (targetY - objCenter.y));
                    drawGuideLine('horizontal', targetY); snappedY = true;
                }
            };
            const snapEdgeX = (targetX, isLeftEdge) => {
                if (snappedX) return;
                let currentEdge = isLeftEdge ? objBound.left : objBound.left + objBound.width;
                if (Math.abs(currentEdge - targetX) < snapZone) {
                    obj.set('left', obj.left + (targetX - currentEdge));
                    drawGuideLine('vertical', targetX); snappedX = true;
                }
            };
            const snapEdgeY = (targetY, isTopEdge) => {
                if (snappedY) return;
                let currentEdge = isTopEdge ? objBound.top : objBound.top + objBound.height;
                if (Math.abs(currentEdge - targetY) < snapZone) {
                    obj.set('top', obj.top + (targetY - currentEdge));
                    drawGuideLine('horizontal', targetY); snappedY = true;
                }
            };

            snapX(canvas.width / 2); snapY(canvas.height / 2);
            snapEdgeX(0, true); snapEdgeX(canvas.width, false);
            snapEdgeY(0, true); snapEdgeY(canvas.height, false);

            const objects = canvas.getObjects().filter(o => o !== obj && !o.excludeFromExport && o.type !== 'polyline');
            for (let i = 0; i < objects.length; i++) {
                if (snappedX && snappedY) break;
                let target = objects[i];
                let tCenter = target.getCenterPoint();
                let tBound = target.getBoundingRect();
                snapX(tCenter.x); snapY(tCenter.y);
                snapEdgeX(tBound.left, true); snapEdgeX(tBound.left + tBound.width, false);
                snapEdgeY(tBound.top, true); snapEdgeY(tBound.top + tBound.height, false);
            }
            obj.setCoords();
        });

        canvas.on('mouse:up', function() { clearGuidelines(); });

        let isDrawingPolyline = false, polylinePoints = [], lineArray = [];
        const polylineBtn = document.getElementById('polylineBtn');

        function startPolyline() {
            disableDrawingModes(); isDrawingPolyline = true;
            canvas.defaultCursor = 'crosshair'; canvas.selection = false; canvas.skipTargetFind = true; 
            polylinePoints = []; lineArray = [];
            polylineBtn.classList.add('bg-indigo-50', 'border-indigo-200');
            showToast("Klik titik garis, tekan ENTER selesai.");
        }

        function finishPolyline() {
            if (!isDrawingPolyline) return;
            isDrawingPolyline = false; canvas.defaultCursor = 'default'; canvas.selection = true; canvas.skipTargetFind = false;
            lineArray.forEach(line => canvas.remove(line));
            
            let validPoints = [];
            for (let i = 0; i < polylinePoints.length; i++) {
                if (i > 0 && polylinePoints[i].x === polylinePoints[i-1].x && polylinePoints[i].y === polylinePoints[i-1].y) continue;
                validPoints.push(polylinePoints[i]);
            }
            if (validPoints.length > 1) {
                let poly = new fabric.Polyline(validPoints, {
                    stroke: document.getElementById('strokeColor').value || '#4f46e5',
                    strokeWidth: parseInt(document.getElementById('strokeWidth').value) || 4,
                    fill: 'transparent', selectable: true, hasControls: true, strokeLineCap: 'round', strokeLineJoin: 'round'
                });
                canvas.add(poly); canvas.setActiveObject(poly); saveHistory();
            }
            polylinePoints = []; lineArray = []; polylineBtn.classList.remove('bg-indigo-50', 'border-indigo-200');
        }

        canvas.on('mouse:down', function(opt) {
            if (opt.e.altKey) return; 
            
            if (isFillBucketMode && !isCropping) {
                let pointer = canvas.getPointer(opt.e);
                const startX = Math.round(pointer.x);
                const startY = Math.round(pointer.y);
                const fillColorHex = document.getElementById('fillColor').value;
                performFloodFill(startX, startY, fillColorHex);
                return;
            }

            if (isDrawingPolyline) {
                let pointer = canvas.getPointer(opt.e);
                polylinePoints.push({ x: pointer.x, y: pointer.y });
                let line = new fabric.Line([pointer.x, pointer.y, pointer.x, pointer.y], {
                    strokeWidth: parseInt(document.getElementById('strokeWidth').value) || 4,
                    stroke: document.getElementById('strokeColor').value || '#4f46e5',
                    strokeLineCap: 'round', selectable: false, evented: false, opacity: 0.7
                });
                lineArray.push(line); canvas.add(line);
            }
        });
        
        canvas.on('mouse:move', function(opt) {
            if (isDrawingPolyline && lineArray.length > 0) {
                let activeLine = lineArray[lineArray.length - 1];
                activeLine.set({ x2: canvas.getPointer(opt.e).x, y2: canvas.getPointer(opt.e).y }); canvas.renderAll();
            }
        });

        let isGridVisible = false, gridObjects = [];
        const gridToggleBtn = document.getElementById('gridToggleBtn');
        function toggleGrid() {
            isGridVisible = !isGridVisible;
            if (isGridVisible) { drawGrid(); gridToggleBtn.classList.add('bg-indigo-50', 'text-indigo-600'); } 
            else { removeGrid(); gridToggleBtn.classList.remove('bg-indigo-50', 'text-indigo-600'); }
        }
        function drawGrid() {
            removeGrid(); const size = 50;
            for (let i = 0; i <= canvas.width / size; i++) {
                let l = new fabric.Line([i*size, 0, i*size, canvas.height], { stroke: 'rgba(0,0,0,0.08)', selectable: false, evented: false, excludeFromExport: true });
                let t = new fabric.Text((i*size).toString(), { left: i*size+2, top: 2, fontSize: 10, fill: 'rgba(0,0,0,0.3)', selectable: false, evented: false, excludeFromExport: true, fontFamily: 'Inter' });
                gridObjects.push(l, t); canvas.add(l, t); canvas.sendToBack(l);
            }
            for (let i = 0; i <= canvas.height / size; i++) {
                let l = new fabric.Line([0, i*size, canvas.width, i*size], { stroke: 'rgba(0,0,0,0.08)', selectable: false, evented: false, excludeFromExport: true });
                if(i!==0) { let t = new fabric.Text((i*size).toString(), { left: 2, top: i*size+2, fontSize: 10, fill: 'rgba(0,0,0,0.3)', selectable: false, evented: false, excludeFromExport: true, fontFamily: 'Inter' }); gridObjects.push(t); canvas.add(t); }
                gridObjects.push(l); canvas.add(l); canvas.sendToBack(l);
            }
            canvas.renderAll();
        }
        function removeGrid() { gridObjects.forEach(obj => canvas.remove(obj)); gridObjects = []; canvas.renderAll(); }
        gridToggleBtn.addEventListener('click', toggleGrid);

        canvas.on('mouse:wheel', function(opt) {
            let z = currentZoom * (0.999 ** opt.e.deltaY); 
            z = Math.max(0.1, Math.min(5, z));
            applyZoom(z);
            saveHistory();
            opt.e.preventDefault(); 
            opt.e.stopPropagation();
        });

        canvas.on('mouse:down', function(opt) { 
            if(opt.e.altKey) { 
                this.isDragging = true; 
                this.selection = false; 
                this.lastPosX = opt.e.clientX; 
                this.lastPosY = opt.e.clientY; 
            } 
        });

        canvas.on('mouse:move', function(opt) { 
            if(this.isDragging) { 
                let e = opt.e, vpt = this.viewportTransform; 
                vpt[4] += e.clientX - this.lastPosX; 
                vpt[5] += e.clientY - this.lastPosY; 
                this.requestRenderAll(); 
                this.lastPosX = e.clientX; 
                this.lastPosY = e.clientY; 
            } 
        });

        canvas.on('mouse:up', function() { 
            if (this.isDragging) {
                this.setViewportTransform(this.viewportTransform); 
                this.isDragging = false; 
                if(!isDrawingPolyline && !isFillBucketMode) this.selection = true;
                saveHistory(); 
            }
        });

        // REFERENSI PANEL KANAN
        const rightSidebar = document.getElementById('rightSidebar');
        const objectTypeLabel = document.getElementById('objectTypeLabel');
        const textTools = document.getElementById('textTools');
        const imageToolsContainer = document.getElementById('imageToolsContainer');
        
        const fillInput = document.getElementById('fillColor');
        const strokeInput = document.getElementById('strokeColor');
        const strokeWInput = document.getElementById('strokeWidth');
        const radiusInput = document.getElementById('cornerRadius');
        const opacitySlider = document.getElementById('opacitySlider');
        const radiusContainer = document.getElementById('radiusContainer');

        let isCropping = false;

        function startCrop() {
            const activeObj = canvas.getActiveObject();
            if (!activeObj || activeObj.type !== 'image') {
                showToast('Pilih objek GAMBAR terlebih dahulu!', 'error');
                return;
            }
            if (activeObj.angle !== 0) {
                showToast('Reset rotasi gambar (0 derajat) sebelum melakukan crop.', 'error');
                return;
            }

            disableDrawingModes();
            isCropping = true;
            cropImageObj = activeObj;

            cropImageObj.set({ selectable: false, evented: false });

            cropRect = new fabric.Rect({
                left: cropImageObj.left,
                top: cropImageObj.top,
                width: cropImageObj.getScaledWidth(),
                height: cropImageObj.getScaledHeight(),
                fill: 'rgba(0,0,0,0.1)',
                stroke: '#10b981', 
                strokeWidth: 3,
                strokeDashArray: [6, 6],
                cornerColor: '#10b981',
                cornerStrokeColor: '#065f46',
                transparentCorners: false,
                cornerSize: 12,
                cornerStyle: 'circle',
                hasRotatingPoint: false,
                lockRotation: true,
                excludeFromExport: true
            });

            canvas.add(cropRect);
            canvas.setActiveObject(cropRect);
            canvas.renderAll();

            cropControlsUI.classList.remove('hidden');
            cropControlsUI.classList.add('flex');
            rightSidebar.classList.add('opacity-50', 'pointer-events-none');
            showToast("Geser atau ubah ukuran kotak hijau untuk memotong.", "info");
        }

        function applyCrop() {
            if (!isCropping || !cropRect || !cropImageObj) return;

            const cRect = cropRect.getBoundingRect();
            const iRect = cropImageObj.getBoundingRect();

            const left = Math.max(cRect.left, iRect.left);
            const top = Math.max(cRect.top, iRect.top);
            const right = Math.min(cRect.left + cRect.width, iRect.left + iRect.width);
            const bottom = Math.min(cRect.top + cRect.height, iRect.top + iRect.height);

            const cropWidth = right - left;
            const cropHeight = bottom - top;

            if (cropWidth > 0 && cropHeight > 0) {
                const scaleX = cropImageObj.scaleX;
                const scaleY = cropImageObj.scaleY;

                const currentCropX = cropImageObj.cropX || 0;
                const currentCropY = cropImageObj.cropY || 0;

                const newCropX = (left - cropImageObj.left) / scaleX + currentCropX;
                const newCropY = (top - cropImageObj.top) / scaleY + currentCropY;
                const newWidth = cropWidth / scaleX;
                const newHeight = cropHeight / scaleY;

                cropImageObj.set({
                    cropX: newCropX,
                    cropY: newCropY,
                    width: newWidth,
                    height: newHeight,
                    left: left,
                    top: top
                });
            }

            endCrop();
            showToast("Gambar berhasil dipotong");
            saveHistory();
        }

        function cancelCrop() {
            endCrop();
            showToast("Potong gambar dibatalkan");
        }

        function endCrop() {
            isCropping = false;
            
            if (cropImageObj) {
                cropImageObj.set({ selectable: true, evented: true });

            if (cropRect) {

        function performFloodFill(startX, startY, fillColorHex) {
            if (startX < 0 || startX >= canvas.width || startY < 0 || startY >= canvas.height) return;

            showToast("Memproses pewarnaan...", "info");
            
            const origZoom = currentZoom;
            applyZoom(1);
            const origVpt = [...canvas.viewportTransform];
            const wasSelection = canvas.selection;
            
            canvas.setViewportTransform([1,0,0,1,0,0]);
            canvas.selection = false;
            canvas.discardActiveObject();
            canvas.renderAll();

            const tempCanvas = document.createElement('canvas');
            const cw = canvas.width;
            const ch = canvas.height;
            tempCanvas.width = cw;
            tempCanvas.height = ch;
            const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
            
            tempCtx.drawImage(canvas.getElement(), 0, 0, cw, ch);
            
            canvas.setViewportTransform(origVpt);
            applyZoom(origZoom);
            canvas.selection = wasSelection;
            canvas.renderAll();

            const imgData = tempCtx.getImageData(0, 0, cw, ch);
            const data = imgData.data;

            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(fillColorHex);
            const targetColor = result ? [parseInt(result[1], 16), parseInt(result[2], 16), parseInt(result[3], 16)] : [0,0,0];
            
            const startIndex = (startY * cw + startX) * 4;
            const startR = data[startIndex], startG = data[startIndex+1], startB = data[startIndex+2], startA = data[startIndex+3];

            if (Math.abs(startR - targetColor[0]) < 10 && Math.abs(startG - targetColor[1]) < 10 && Math.abs(startB - targetColor[2]) < 10) return;

            const fillImgData = tempCtx.createImageData(cw, ch);
            const fillData = fillImgData.data;
            
            const tolerance = 40;
            let pixelsFilled = 0;

            function matchStartColor(pos) {
                return Math.abs(data[pos] - startR) <= tolerance && 
                       Math.abs(data[pos+1] - startG) <= tolerance && 
                       Math.abs(data[pos+2] - startB) <= tolerance && 
                       Math.abs(data[pos+3] - startA) <= tolerance;
            }

            const stack = [[startX, startY]];

            while (stack.length > 0) {
                const [x, y] = stack.pop();
                let currentY = y;
                let currentPos = (currentY * cw + x) * 4;

                while (currentY >= 0 && matchStartColor(currentPos)) {
                    currentY--; currentPos -= cw * 4;
                }
                currentY++; currentPos += cw * 4;

                let reachLeft = false, reachRight = false;

                while (currentY < ch && matchStartColor(currentPos)) {
                    data[currentPos] = targetColor[0]; data[currentPos+1] = targetColor[1]; data[currentPos+2] = targetColor[2]; data[currentPos+3] = 255;
                    fillData[currentPos] = targetColor[0]; fillData[currentPos+1] = targetColor[1]; fillData[currentPos+2] = targetColor[2]; fillData[currentPos+3] = 255;
                    pixelsFilled++;

                    if (x > 0) {
                        if (matchStartColor(currentPos - 4)) {
                            if (!reachLeft) { stack.push([x - 1, currentY]); reachLeft = true; }
                        } else if (reachLeft) { reachLeft = false; }
                    }

                    if (x < cw - 1) {
                        if (matchStartColor(currentPos + 4)) {
                            if (!reachRight) { stack.push([x + 1, currentY]); reachRight = true; }
                        } else if (reachRight) { reachRight = false; }
                    }
                    currentY++; currentPos += cw * 4;
                }
            }

            if (pixelsFilled > 0) {
                const resultCanvas = document.createElement('canvas');
                resultCanvas.width = cw; resultCanvas.height = ch;
                resultCanvas.getContext('2d').putImageData(fillImgData, 0, 0);
                
                fabric.Image.fromURL(resultCanvas.toDataURL(), function(img) {
                    img.set({ left: 0, top: 0, selectable: true, evented: true });
                    canvas.add(img);
                    canvas.setActiveObject(img);
                    saveHistory();
                    showToast("Area berhasil diwarnai!");
                });
            }
        }
    </script>
